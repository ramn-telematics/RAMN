name: host tests

on:
  push:
  pull_request:

jobs:
  host_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Plain gcc, no ARM toolchain -- this job exists to be fast enough that
      # nobody is tempted to skip it.
      - name: Run firmware host tests
        run: make -C firmware/RAMNV1/test/host
